# Runs on every Pull Request and every push to main: the same checks everyone
# runs on their laptop (python check.py + the tests). A green tick on the PR
# means "this branch still works"; a red cross means "click Details to see why".
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # pyautogui and screen capture need a (virtual) display on Linux.
      - name: Install a virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb python3-tk libxtst6 libxrandr2 libxfixes3

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Setup check (python check.py)
        run: xvfb-run -a python check.py

      - name: Tests (pytest)
        run: |
          set +e
          xvfb-run -a python -m pytest tests -q
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests yet, that's OK."; exit 0; fi
          exit $code
